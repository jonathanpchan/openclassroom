<html>
  <head></head>
  <body class="chat-grid">
    <div class="msglist-title">OC Messenger</div>
    <ul class="msglist-users">
      <li class="msglist-user" *ngFor="let name of names">
        <button class="btn" (click)="joinRoom(name)" style="width: 100%; height: 100%;">{{name}}</button>
      </li>
    </ul>
    <div class="chat-title">
      <div *ngIf="sendee!=null" class="announcer">{{sendee}}</div>
    </div>
    <!-- https://stackoverflow.com/questions/35232731/angular2-scroll-to-bottom-chat-style -->
    <div class="chatlogs" #chatlogs [scrollTop]="chatlogs.scrollHeight">
      <div *ngFor="let message of messages">
        <div *ngIf="message.sender!=sender" class="chat sendee">
          <p class="chatmsg">{{message.message}}</p>
        </div>
        <div *ngIf="message.sender==sender" class="chat sender">
          <p class="chatmsg">{{message.message}}</p>
        </div>
      </div>
    </div>
    <form class="chat-form" (submit)="sendMessage()">
      <input type="text" class="col-xs-11 chat-input" [(ngModel)]="message" [ngModelOptions]="{standalone: true}"/>
      <button type="submit" class="col-xs-1 btn btn-primary chat-submit">
        <span class="glyphicon glyphicon-send" aria-hidden="true"></span>
      </button>
    </form>
  </body>
  <!-- For testing Purposes -->
  <button class="btn btn-default" style="float: right" (click)="stub()">Other user</button>
</html>
