<div class="tablecontainer">
  <h1 align="center" class ="list-title" >Study Booties</h1>
  <div class = "scrollable">
    <ul id="grouplist" class="list-group">
      <ul class="list-group-item" *ngFor="let item of names">
        <a (click)="displayMsg(item)">{{item}}
        </a>
      </ul>
    </ul>
  </div>
</div>

<ng-container>
  <div *ngIf = showChat style="chatcontainer">
    <div>
      Room #
      <select [(ngModel)]="roomOption" (change)="joinRoom(roomOption)">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div style="height: 200px; overflow-y: auto; border: 2px black solid">
      <div *ngFor="let message of messages">
        {{message.text}}
      </div>
    </div>
    <div>
      <input [(ngModel)]="message" [ngModelOptions]="{standalone: true}" /><button (click)="sendMessage(currentRoom)">Send</button>
    </div>
  </div>
</ng-container>
