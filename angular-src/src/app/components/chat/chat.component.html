<div class="container col-xs-12">
  <div class="row col-xs-12 banner">
    <div *ngIf="sendee!=null" class="announcer">You are chatting with {{sendee}}</div>
  </div>
  <div class="col-xs-3 msglist">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let name of names">
        <button (click)="joinRoom(name)" style="width:100%; height: 100%;">{{name}}</button>
      </li>
    </ul>
  </div>
  <div class="col-xs-9 chatbox">
    <!-- https://stackoverflow.com/questions/35232731/angular2-scroll-to-bottom-chat-style -->
    <div class="col-xs-12 chatlogs" #chatlogs [scrollTop]="chatlogs.scrollHeight">
      <div *ngFor="let message of messages">
        <div *ngIf="message.sender!=sender"class="sendee">
          <p class="chatmsg">{{message.message}}</p>
        </div>
        <div *ngIf="message.sender==sender" class="sender">
          <p class="chatmsg">{{message.message}}</p>
        </div>
      </div>
    </div>
    <form class="col-xs-12 chatboxform" (submit)="sendMessage()">
      <input type="text" class="col-xs-11 text" [(ngModel)]="message" [ngModelOptions]="{standalone: true}"/>
      <button type="submit" class="col-xs-1 btn btn-primary">
        <span class="glyphicon glyphicon-send" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>
<button class="btn btn-default" (click)="stub()">Other user</button>
