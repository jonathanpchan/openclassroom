<div class="container col-xs-12">
  <div class="row col-xs-12 banner">
    <!-- Room #
    <select [(ngModel)]="roomOption" (change)="joinRoom(roomOption)">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select> -->
  </div>
  <div class="col-xs-3 msglist">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let name of names">
        <button (click)="joinRoom(name)" style="width:100%; height: 100%;">{{name}}</button>
      </li>
    </ul>
  </div>
  <div class="col-xs-9 chatbox">
    <div class="col-xs-12 msglog">
      <div *ngFor="let message of messages" >
        <div *ngIf="message.sender=='sendee'"class="sendee">
          <p class="chatmsg">{{message.text}}</p>
        </div>
        <div *ngIf="message.sender=='sender'" class="sender">
          <p class="chatmsg">{{message.text}}</p>
        </div>
        <div *ngIf="message.sender=='announcer'" class="announcer">
          <p>{{message.text}}</p>
        </div>
      </div>
    </div>
    <form class="col-xs-12 msgform" (ngSubmit)="sendMessage()">
      <input type="text" class="col-xs-11 text" [(ngModel)]="message" [ngModelOptions]="{standalone: true}"/>
      <button type="submit" class="col-xs-1 btn btn-primary" (click)="sendMessage()">
        <span class="glyphicon glyphicon-send" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>
